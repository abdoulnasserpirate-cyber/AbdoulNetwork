  <script>
    (function () {
      const ID = "s2-avalanche";
      const S = +document.querySelector('[data-composition-id="' + ID + '"][data-start]').dataset.start;
      const T = (a) => Math.max(0, a - S);
      const R = document.querySelector('[data-composition-id="' + ID + '"]');
      FX.mountIcons(R);
      const V = FX.isV();
      const tl = gsap.timeline({ paused: true });
      const panels = ["#s2-a", "#s2-a-top", "#s2-a-bot", "#s2-b", "#s2-c", "#s2-d", "#s2-e", "#s2-f", "#s2-g"];
      // visibilité des panneaux (instantanée, sur la voix)
      const show = (sel, a, b) => { tl.set(sel, { autoAlpha: 1 }, T(a)); if (b) tl.set(sel, { autoAlpha: 0 }, T(b)); };
      gsap.set(panels.join(","), { autoAlpha: 0 });

      // ── a · COLIS (3.25 → 4.30) : circle reveal depuis le combiné de S1
      const ox = V ? "50%" : "27%", oy = V ? "27%" : "48%";
      show("#s2-a", 3.25, 4.3);
      tl.fromTo("#s2-a", { clipPath: `circle(0% at ${ox} ${oy})` }, { clipPath: `circle(150% at ${ox} ${oy})`, duration: 0.42, ease: "power3.inOut" }, 0);
      FX.slam(tl, "#s2-a-word", T(3.42), { from: 1.7 });
      tl.fromTo("#s2-a-box", { y: "-120cqh", rotate: -25 }, { y: 0, rotate: 8, duration: 0.42, ease: "bounce.out" }, T(3.5));
      // ── slice : COLIS se fend en deux (4.30) → COURSES
      show("#s2-a-top, #s2-a-bot", 4.3, 4.62);
      gsap.set(["#s2-a-top .s2-ico", "#s2-a-bot .s2-ico"], { rotate: 8 });
      tl.fromTo("#s2-a-top", { yPercent: 0 }, { yPercent: -55, duration: 0.3, ease: "power3.in" }, T(4.3));
      tl.fromTo("#s2-a-bot", { yPercent: 0 }, { yPercent: 55, duration: 0.3, ease: "power3.in" }, T(4.3));
      show("#s2-b", 4.3, 5.28);
      tl.fromTo("#s2-b-word", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, T(4.4));
      FX.dropLetters(tl, document.getElementById("s2-b-word"), T(4.46), { from: 60, stagger: 0.03, dur: 0.3 });
      tl.fromTo("#s2-b-bag", { scale: 0, rotate: -40 }, { scale: 1, rotate: -6, duration: 0.5, ease: "back.out(2.2)" }, T(4.54));
      tl.fromTo("#s2-b", { scale: 1.08 }, { scale: 1, duration: 0.9, ease: "power2.out" }, T(4.3));
      // ── c · DOCUMENTS : coupe nette sur le temps (5.28), mot étiré
      show("#s2-c", 5.28, 6.0);
      tl.fromTo("#s2-c-word", { scaleX: 2.3, scaleY: 0.45, opacity: 0.2 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.5, ease: "elastic.out(1,0.6)" }, T(5.3));
      tl.fromTo("#s2-c-doc", { x: "40cqw", rotate: 30 }, { x: 0, rotate: -8, duration: 0.45, ease: "expo.out" }, T(5.36));
      tl.fromTo("#s2-c", { x: 0 }, { x: V ? -14 : -24, duration: 0.7, ease: "sine.inOut" }, T(5.3));
      // ── d · split-screen 4 cases (6.00) + REPAS (6.24)
      show("#s2-d", 6.0, 6.86);
      const cells = ["#s2-c1", "#s2-c2", "#s2-c3", "#s2-c4"];
      const from = V ? [{ x: "-100cqw" }, { y: "-100cqh" }, { y: "100cqh" }, { x: "100cqw" }] : [{ y: "-100cqh" }, { y: "100cqh" }, { y: "-100cqh" }, { y: "100cqh" }];
      cells.forEach((c, i) => tl.fromTo(c, from[i], { x: 0, y: 0, duration: 0.3, ease: "expo.out" }, T(5.98) + i * 0.05));
      tl.fromTo("#s2-d-band", { scaleY: 0 }, { scaleY: 1, duration: 0.22, ease: "expo.out" }, T(6.2));
      FX.slam(tl, "#s2-d-word", T(6.22), { from: 1.6, dur: 0.36 });
      tl.fromTo("#s2-c4 .ico", { scale: 1 }, { scale: 1.18, duration: 0.25, ease: "back.out(3)" }, T(6.24));
      // ── e · whip pan : le scooter traverse (6.84) → trajet Kano → Maradi
      tl.to("#s2-d", { x: "-100cqw", filter: "blur(18px)", duration: 0.2, ease: "power3.in" }, T(6.8));
      show("#s2-e", 6.86, 8.78);
      tl.fromTo("#s2-moto", { x: "-60cqw" }, { x: "140cqw", duration: 0.5, ease: "power2.inOut" }, T(6.82));
      tl.fromTo("#s2-moto", { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.25, ease: "power1.out" }, T(6.82));
      tl.set("#s2-moto", { autoAlpha: 0 }, T(7.34));
      tl.fromTo(".s2-sl", { x: "-50cqw", scaleX: 0.3 }, { x: "120cqw", scaleX: 1.4, duration: 0.5, ease: "power2.inOut", stagger: 0.04 }, T(6.84));
      tl.set("#s2-speed", { autoAlpha: 0 }, T(7.45));
      const route = R.querySelector("#s2-route");
      tl.fromTo(route, { strokeDashoffset: 0, opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, T(7.0));
      tl.fromTo("#s2-map", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power2.inOut" }, T(7.0));
      tl.fromTo("#s2-kano", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, T(7.02));
      tl.fromTo("#s2-maradi", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, T(7.72));
      // le carton suit la courbe (positions en % du cadre, calculées sur la courbe de Bézier)
      // trajet Kano → Maradi : une courbe de Bézier, mêmes points pour le tracé et le carton
      const P = V ? [[22, 56], [30, 44], [70, 52], [78, 33]] : [[17, 71], [40, 50], [62, 70], [84, 42]];
      route.setAttribute("d", `M${P[0]} C${P[1]} ${P[2]} ${P[3]}`);
      ["#s2-dot1", "#s2-dot2"].forEach((d, i) => { const q = P[i * 3]; R.querySelector(d).setAttribute("cx", q[0]); R.querySelector(d).setAttribute("cy", q[1]); });
      const bez = (a, b, c, d, t) => { const u = 1 - t; return u*u*u*a + 3*u*u*t*b + 3*u*t*t*c + t*t*t*d; };
      const pt = (t) => ({ x: bez(P[0][0], P[1][0], P[2][0], P[3][0], t), y: bez(P[0][1], P[1][1], P[2][1], P[3][1], t) });
      const prog = { p: 0 };
      tl.fromTo(prog, { p: 0 }, { p: 1, duration: 1.0, ease: "power2.inOut",
        onUpdate: () => { const q = pt(prog.p); gsap.set("#s2-travel", { left: q.x + "%", top: q.y + "%" }); } }, T(7.05));
      tl.fromTo("#s2-travel", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, T(7.05));
      tl.fromTo("#s2-e-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, T(7.1));
      tl.fromTo("#s2-e-title .yel", { scale: 0.6 }, { scale: 1, duration: 0.4, ease: "back.out(2.5)" }, T(7.72));
      tl.fromTo("#s2-e", { scale: 1 }, { scale: 1.06, duration: 1.9, ease: "sine.inOut" }, T(6.86));
      // ── f · LESSIVE : la photo réelle remplit les lettres (8.78)
      show("#s2-f", 8.78, 9.74);
      tl.fromTo("#s2-f", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.28, ease: "expo.out" }, T(8.76));
      tl.fromTo("#s2-f-word", { yPercent: 40, scale: 0.9 }, { yPercent: 0, scale: 1, duration: 0.45, ease: "expo.out" }, T(8.82));
      tl.fromTo("#s2-f-word", { backgroundPosition: "50% 80%" }, { backgroundPosition: "50% 45%", duration: 1.0, ease: "sine.inOut" }, T(8.8));
      tl.fromTo("#s2-f-label", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, T(8.8));
      tl.fromTo(".s2-bub", { y: 60, scale: 0.4 }, { y: -140, scale: 1.1, duration: 1.0, ease: "power1.out", stagger: 0.05 }, T(8.76));
      // ── g · REPASSAGE : le fer balaie et « repasse » le mot (9.74)
      show("#s2-g", 9.74);
      tl.fromTo("#s2-g", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.26, ease: "power3.out" }, T(9.72));
      const sweep = { p: 0 };
      tl.fromTo(sweep, { p: 0 }, { p: 1, duration: 0.62, ease: "power2.inOut",
        onUpdate: () => {
          gsap.set("#s2-g-word", { clipPath: `inset(0 ${100 - sweep.p * 100}% 0 0)` });
          gsap.set("#s2-iron", { left: (6 + sweep.p * 88) + "%" });
        } }, T(9.86));
      tl.fromTo("#s2-iron", { rotate: -10, y: 0 }, { rotate: 4, y: 10, duration: 0.62, ease: "sine.inOut" }, T(9.86));
      tl.fromTo(".s2-steam", { y: 0, scale: 0.3, opacity: 0 }, { y: -90, scale: 1.6, opacity: 0.0, duration: 0.7, ease: "power1.out", stagger: 0.12 }, T(9.95));
      tl.fromTo(".s2-steam", { opacity: 0 }, { opacity: 0.8, duration: 0.15, ease: "power1.out", stagger: 0.12 }, T(9.95));
      tl.fromTo("#s2-g-word", { scale: 1 }, { scale: 1.04, duration: 0.5, ease: "power2.out" }, T(10.48));
      window.__timelines[ID] = tl;
    })();
  </script>
