<template>
  <style>
    #root { position: absolute; inset: 0; width: 100% !important; height: 100% !important; overflow: hidden;
      container-type: size; container-name: sc; font-family: var(--font); color: #fff; }
    #s3-ground { position: absolute; inset: 0; background: radial-gradient(80% 70% at 50% 50%, #0d2470 0%, #030a24 75%); }
    #s3-rings .ring { width: 30cqmin; height: 30cqmin; margin: -15cqmin 0 0 -15cqmin; border-width: .6cqmin; }
    #s3-rings .ring:nth-child(odd) { border-color: var(--yellow); }
    #s3-words { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 2.4cqw; }
    .s3-w { font-size: 11cqw; display: inline-block; }
    #s3-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    @container sc (orientation: portrait) {
      #s3-words { flex-direction: column; gap: 0; }
      .s3-w { font-size: 26cqw; }
    }
  </style>
  <div id="root" data-composition-id="s3-nom">
    <div id="s3-ground"></div>
    <div class="cam" id="s3-cam">
      <div id="s3-rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
      <div id="s3-words"><span class="s3-w hero" id="s3-w1">UN</span><span class="s3-w hero" id="s3-w2">SEUL</span><span class="s3-w hero yel" id="s3-w3">NOM.</span></div>
    </div>
    <div id="s3-flash"></div>
    <div class="grain"></div>
  </div>
  <script>
    (function () {
      const ID = "s3-nom";
      const S = +document.querySelector('[data-composition-id="' + ID + '"][data-start]').dataset.start;
      const T = (a) => Math.max(0, a - S);
      const R = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      // dip cut : le cadre s'assombrit en arrivant (10.60)
      tl.fromTo("#s3-ground", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 0);
      // les ondes se contractent vers le centre : tension avant le drop
      tl.fromTo(R.querySelectorAll("#s3-rings .ring"), { scale: 7, opacity: 0 }, { scale: 0.2, opacity: 0.85, duration: 1.1, ease: "power2.in", stagger: 0.12 }, 0.05);
      FX.slam(tl, "#s3-w1", T(11.04), { from: 2.2, dur: 0.3 });
      FX.slam(tl, "#s3-w2", T(11.18), { from: 2.2, dur: 0.3 });
      FX.slam(tl, "#s3-w3", T(11.34), { from: 2.4, dur: 0.34 });
      tl.fromTo("#s3-cam", { scale: 1 }, { scale: 1.22, duration: 1.34, ease: "power2.in" }, 0);
      tl.fromTo("#s3-flash", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.in" }, T(11.84));
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
