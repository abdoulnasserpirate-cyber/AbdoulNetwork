<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Aperçu de partage (Open Graph) 1200×630</title>
<link rel="stylesheet" href="base.css" />
<style>
  html, body { width:1200px; height:630px; }
  body { background:
      radial-gradient(55% 80% at 15% 20%, #8b5cf655, transparent 70%),
      radial-gradient(45% 70% at 95% 100%, #22d3ee40, transparent 70%),
      #080b12; color:#f8fafc; }
  .grid { position:absolute; inset:0; opacity:.08; background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px); background-size:60px 60px; mask-image:radial-gradient(ellipse at 30% 40%,#000 10%,transparent 70%); }
  .txt { position:absolute; left:70px; top:70px; width:640px; }
  .logo { display:flex; align-items:center; gap:12px; font:700 26px 'Space Grotesk'; letter-spacing:-.02em; }
  .logo i { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,#8b5cf6,#22d3ee); display:grid; place-items:center; color:#080b12; font-style:normal; font-size:22px; }
  .logo span { color:#a3acbd; }
  h1 { margin-top:46px; font:700 66px/0.95 'Space Grotesk'; letter-spacing:-.045em; }
  h1 em { font-style:normal; background:linear-gradient(100deg,#8b5cf6,#a78bfa 35%,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.1em; }
  .line { margin-top:26px; font:500 24px 'Space Grotesk'; color:#a3acbd; }
  .line b { color:#8b5cf6; }
  .badge { position:absolute; left:70px; bottom:62px; display:inline-flex; align-items:center; gap:12px; padding:7px 18px 7px 7px; border-radius:99px; background:#101828cc; border:1px solid #ffffff1a; font:500 20px 'Inter'; }
  .badge b { background:linear-gradient(90deg,#8b5cf6,#22d3ee); color:#080b12; padding:7px 14px; border-radius:99px; font:700 20px 'Inter'; }
  .photo { position:absolute; right:70px; top:60px; width:360px; height:510px; border-radius:30px; padding:2px; background:linear-gradient(135deg,#8b5cf6,#ffffff22,#22d3ee); box-shadow:0 0 120px -10px #8b5cf6aa; }
  .photo div { width:100%; height:100%; border-radius:28px; overflow:hidden; }
  .photo img { width:100%; height:100%; object-fit:cover; object-position:50% 10%; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="txt">
    <div class="logo"><i>A</i>Abdoul<span>&nbsp;Network</span></div>
    <h1>Je transforme tes idées en <em>expériences digitales.</em></h1>
    <div class="line">IA <b>·</b> Motion design <b>·</b> Vidéo <b>·</b> Web <b>·</b> Applications</div>
  </div>
  <div class="badge"><b>+200</b>personnes formées · Maradi, Niger</div>
  <div class="photo"><div><img src="../public/images/profile.webp" alt="" /></div></div>
</body>
</html>
