<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Visuel — Création de compte TikTok monétisable</title>
<link rel="stylesheet" href="base.css" />
<style>
  body { background:#0b0b0d; }
  .blur { position:absolute; inset:-80px; background:url(../public/images/tiktok-monetisable.webp) center/cover; filter: blur(60px) saturate(1.3); opacity:.55; }
  .dim { position:absolute; inset:0; background: radial-gradient(60% 70% at 50% 50%, #0000 0%, #000b 100%); }
  .poster { position:absolute; left:50%; top:50%; width:820px; height:820px; transform: translate(-50%,-50%) rotate(-3deg); border-radius:22px; overflow:hidden;
    box-shadow: 0 0 0 1px #ffffff22, 0 60px 120px -20px #000, 0 0 120px -20px #f97316aa; }
  .poster img { width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
  <div class="blur"></div><div class="dim"></div>
  <div class="poster"><img src="../public/images/tiktok-monetisable.webp" alt="" /></div>
</body>
</html>
