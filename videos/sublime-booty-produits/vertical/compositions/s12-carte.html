    <div id="s12-kicker" class="sb-line sb-huge sb-slab pink">Livraison</div>
    <div id="s12-p1" class="s12-place sb-line sb-huge sb-slab white">À Maradi</div>
    <div id="s12-p2" class="s12-place sb-line sb-huge sb-slab white">Partout au Niger</div>
    <div id="s12-p3" class="s12-place sb-line sb-huge sb-slab white">Dans le monde</div>
    <div id="s12-credit" data-layout-ignore>Frontières : Natural Earth</div>
  </div>
  <script>
    (function () {
      const D = 3.1;
      const M = window.SBM;
      const portrait = window.SB3D.isPortrait();
      const Wm = 2000;
      const proj = (lon, lat) => [((lon + 180) / 360) * Wm, (Wm / 2 / Math.PI) * (Math.PI - Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI) / 360)))];
      const svg = document.getElementById("s12-map");
      const pin = document.getElementById("s12-pin");
      const [mx, my] = proj(7.1, 13.5); // Maradi
      const aspect = portrait ? 1080 / 1920 : 1920 / 1080;
      // Camera stops: centre and visible width in map units.
      const stops = portrait
        ? { maradi: [mx, my - 6, 46], niger: [1046, 900, 150], world: [1000, 820, 2000] }
        : { maradi: [mx + 4, my - 3, 90], niger: [1060, 898, 270], world: [1000, 790, 2000] };
      const cam = { cx: stops.maradi[0], cy: stops.maradi[1], w: stops.maradi[2] };
      function applyCam() {
        const h = cam.w / aspect;
        svg.setAttribute("viewBox", `${cam.cx - cam.w / 2} ${cam.cy - h / 2} ${cam.w} ${h}`);
        const k = cam.w / (portrait ? 1080 : 1920) * 2.2; // pin keeps ~constant screen size
        pin.setAttribute("transform", `translate(${mx} ${my}) scale(${k})`);
      }
      // Delivery arcs from Maradi.
      const dests = [[2.35, 48.86], [-74, 40.7], [-4.0, 5.36], [55.3, 25.2], [-0.13, 51.5], [39.2, 21.5]];
      const arcs = document.getElementById("s12-arcs");
      const NS = "http://www.w3.org/2000/svg";
      const arcEls = dests.map(([lon, lat]) => {
        const [x, y] = proj(lon, lat);
        const qx = (mx + x) / 2, qy = Math.min(my, y) - Math.hypot(x - mx, y - my) * 0.35;
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", `M${mx} ${my} Q${qx} ${qy} ${x} ${y}`);
        arcs.appendChild(p);
        const len = p.getTotalLength() || 1;
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
        const dot = document.createElementNS(NS, "circle");
        dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("r", 7);
        arcs.appendChild(dot);
        return { p, dot, len };
      });

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s12-pin-in", { scale: 0, y: -30 }, { scale: 1, y: 0, duration: 0.4, ease: "back.out(2.6)", svgOrigin: "0 0" }, 0.2);
      tl.to(cam, { cx: stops.niger[0], cy: stops.niger[1], w: stops.niger[2], duration: 0.55, ease: "power2.inOut", onUpdate: applyCam }, 0.9);
      tl.to(cam, { cx: stops.world[0], cy: stops.world[1], w: stops.world[2], duration: 0.7, ease: "power3.inOut", onUpdate: applyCam }, 1.95);
      arcEls.forEach((a, i) => {
        tl.fromTo(a.p, { strokeDashoffset: a.len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 2.4 + i * 0.06);
        tl.fromTo(a.dot, { opacity: 0 }, { opacity: 1, duration: 0.1 }, 2.85 + i * 0.06);
      });
      M.reveal(tl, "#s12-kicker", 0.05);
      M.slam(tl, "#s12-p1", 0.3);
      tl.to("#s12-p1", { opacity: 0, filter: "blur(8px)", duration: 0.14 }, 0.88);
      M.slam(tl, "#s12-p2", 1.0);
      tl.to("#s12-p2", { opacity: 0, filter: "blur(8px)", duration: 0.14 }, 1.9);
      M.slam(tl, "#s12-p3", 2.0);
      tl.set({}, {}, D);
      applyCam();
      window.__timelines = window.__timelines || {};
      window.__timelines["s12"] = tl;
    })();
  </script>
