<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/amd.css" />
      <style>
        #s1-root { position: absolute; inset: 0; overflow: hidden; }
        #s1-ghost { right: -40px; top: -60px; font-size: 560px; writing-mode: vertical-rl; }
        #s1-glow { width: 1300px; height: 1300px; right: -260px; top: -120px; }
        #s1-people { position: absolute; right: 0; top: 0; width: 900px; height: 1080px; }
        #s1-p1 { right: 20px; bottom: 0; height: 1000px; }
        #s1-p2 { right: 120px; bottom: 0; height: 1040px; }
        #s1-p3 { right: 0; bottom: 0; height: 1060px; }
        #s1-shade { position: absolute; inset: 0; background: radial-gradient(1100px 1100px at 15% 50%, rgba(11,10,8,.88) 0%, rgba(11,10,8,.5) 50%, rgba(11,10,8,0) 75%); }
        #s1-pre { position: absolute; left: 120px; top: 100px; font-size: 76px; color: #F7F3EA; }
        #s1-lines { position: absolute; left: 112px; top: 240px; }
        .s1-line { font-size: 178px; color: #F7F3EA; margin-bottom: 8px; transform-origin: 0% 60%; }
        #s1-slash { left: 100px; top: 838px; width: 1380px; height: 70px; transform-origin: 0% 50%; }
      </style>
      <div id="s1-root" data-composition-id="s1-hook" data-width="1920" data-height="1080">
        <div id="s1-cam" class="amd-cam">
          <div id="s1-glow" class="amd-glow"></div>
          <div id="s1-ghost" class="amd-ghost">武术</div>
          <div id="s1-people">
            <img id="s1-p1" class="amd-person" src="assets/people/muscle.png" alt="" />
            <img id="s1-p2" class="amd-person" src="assets/people/hijab.png" alt="" />
            <img id="s1-p3" class="amd-person" src="assets/people/kungfu.png" alt="" />
          </div>
          <div id="s1-shade"></div>
          <div id="s1-pre" class="amd-mont amd-shadow" data-hf-motion-blur>Vous voulez devenir</div>
          <div id="s1-lines">
            <div id="s1-l1" class="s1-line amd-anton amd-line amd-shadow" data-hf-motion-blur>Plus <span class="amd-gold">fort</span></div>
            <div id="s1-l2" class="s1-line amd-anton amd-line amd-shadow" data-hf-motion-blur>Plus <span class="amd-gold">confiant</span></div>
            <div id="s1-l3" class="s1-line amd-anton amd-line amd-shadow" data-hf-motion-blur>Plus <span class="amd-gold">discipliné ?</span></div>
          </div>
          <img id="s1-slash" class="amd-brush" src="assets/fx/brush-gold-slash.png" alt="" />
        </div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          // absolute voice times (scene starts at 0)
          tl.fromTo('#s1-ghost', { y: 40, opacity: 0 }, { y: -60, opacity: 0.1, duration: 3.06, ease: 'none' }, 0);
          tl.fromTo('#s1-glow', { scale: 0.7, opacity: 0.4 }, { scale: 1.15, opacity: 1, duration: 3.06, ease: 'sine.inOut' }, 0);

          // hook: pre-line slams on frame 1
          tl.fromTo('#s1-pre', { scale: 1.7, opacity: 0, filter: 'blur(14px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.32, ease: 'power4.out', transformOrigin: '0% 50%' }, 0.03);

          // PLUS FORT — scale slam
          tl.fromTo('#s1-l1', { scale: 1.9, opacity: 0, filter: 'blur(16px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power4.out' }, 0.85);
          tl.fromTo('#s1-p1', { x: 160, opacity: 0, scale: 1.1 }, { x: 0, opacity: 1, scale: 1, duration: 0.32, ease: 'expo.out' }, 0.85);
          tl.fromTo('#s1-p1', { opacity: 1 }, { opacity: 0, x: -80, duration: 0.14, ease: 'power2.in', immediateRender: false }, 1.33);

          // PLUS CONFIANT — side snap
          tl.fromTo('#s1-l2', { x: 900, opacity: 0, skewX: -18 }, { x: 0, opacity: 1, skewX: 0, duration: 0.34, ease: 'expo.out' }, 1.39);
          tl.fromTo('#s1-p2', { x: 200, opacity: 0, scale: 1.08 }, { x: 0, opacity: 1, scale: 1, duration: 0.32, ease: 'expo.out' }, 1.39);
          tl.fromTo('#s1-p2', { opacity: 1 }, { opacity: 0, x: -80, duration: 0.14, ease: 'power2.in', immediateRender: false }, 1.96);

          // PLUS DISCIPLINÉ ? — rise + rotate
          tl.fromTo('#s1-l3', { y: 160, rotation: 7, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.38, ease: 'circ.out' }, 2.02);
          tl.fromTo('#s1-p3', { x: 220, opacity: 0, scale: 1.12 }, { x: 0, opacity: 1, scale: 1, duration: 0.34, ease: 'expo.out' }, 2.02);
          tl.fromTo('#s1-slash', { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.3, ease: 'expo.out' }, 2.14);

          // push into the flash cut
          tl.fromTo('#s1-cam', { scale: 1, filter: 'blur(0px)' }, { scale: 1.32, filter: 'blur(10px)', duration: 0.34, ease: 'power3.in' }, 2.72);
          window.__timelines['s1-hook'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
