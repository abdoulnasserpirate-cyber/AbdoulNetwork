<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/amd.css" />
      <style>
        #s6-root { position: absolute; inset: 0; overflow: hidden; }
        #s6-glow { width: 1200px; height: 1200px; right: -200px; top: -120px; }
        #s6-ghost { left: 60px; bottom: -60px; font-size: 380px; }
        #s6-brush { left: 1000px; top: 640px; width: 1200px; height: 260px; transform-origin: 0% 50%; }
        #s6-p { right: 60px; bottom: 0; height: 1000px; }
        #s6-icon { left: 120px; top: 120px; width: 170px; height: 170px; }
        #s6-icon svg { width: 110px; height: 110px; }
        #s6-t1 { position: absolute; left: 110px; top: 330px; font-size: 176px; color: #F7F3EA; }
        #s6-t2 { position: absolute; left: 110px; top: 510px; font-size: 250px; color: #E8B01C; }
        #s6-sub { position: absolute; left: 120px; top: 790px; font-size: 96px; color: #F7F3EA; }
      </style>
      <div id="s6-root" data-composition-id="s6-enfants" data-width="1920" data-height="1080">
        <div id="s6-cam" class="amd-cam">
          <div id="s6-glow" class="amd-glow"></div>
          <div id="s6-ghost" class="amd-ghost">德</div>
          <img id="s6-brush" class="amd-brush" src="assets/fx/brush-gold-2.png" alt="" />
          <img id="s6-p" class="amd-person" src="assets/people/kid.png" alt="" data-hf-motion-blur />
          <div id="s6-icon" class="amd-icon">
            <svg viewBox="0 0 64 64"><circle cx="22" cy="16" r="7" fill="#0B0A08"/><circle cx="44" cy="22" r="5.5" fill="#0B0A08"/><path d="M12 56 V36 C12 29 16 26 22 26 C28 26 32 29 32 36 V56 Z" fill="#0B0A08"/><path d="M36 56 V40 C36 34 39 31 44 31 C49 31 52 34 52 40 V56 Z" fill="#0B0A08"/></svg>
          </div>
          <div id="s6-t1" class="amd-anton amd-line amd-shadow" data-hf-motion-blur>Encadrement</div>
          <div id="s6-t2" class="amd-anton amd-line amd-shadow" data-hf-motion-blur>Enfants</div>
          <div id="s6-sub" class="amd-bebas amd-line amd-shadow">Formation &amp; discipline</div>
        </div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          tl.fromTo('#s6-cam', { scale: 1.08 }, { scale: 1, duration: 1.22, ease: 'power2.out' }, 0);
          tl.fromTo('#s6-brush', { clipPath: 'inset(0% 100% 0% 0%)', rotation: -6 }, { clipPath: 'inset(0% 0% 0% 0%)', rotation: -4, duration: 0.3, ease: 'power3.out' }, 0.02);
          tl.fromTo('#s6-p', { y: 300, opacity: 0, scale: 1.1 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: 'expo.out' }, 0);
          tl.fromTo('#s6-icon', { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: 'back.out(2.2)' }, 0.04);
          tl.fromTo('#s6-t1', { x: -800, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: 'expo.out' }, 0.0);
          tl.fromTo('#s6-t2', { scale: 2, opacity: 0, filter: 'blur(16px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power4.out', transformOrigin: '0% 50%' }, 0.12);
          tl.fromTo('#s6-sub', { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'circ.out' }, 0.3);
          tl.fromTo('#s6-cam', { x: 0 }, { x: -160, filter: 'blur(8px)', duration: 0.22, ease: 'power3.in', immediateRender: false }, 1.0);
          window.__timelines['s6-enfants'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
