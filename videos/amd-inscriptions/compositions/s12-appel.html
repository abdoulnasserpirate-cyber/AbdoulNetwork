      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var S = 35.89; function T(t) { return Math.max(0, t - S); }

          var seed = 99; function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

          for (var i = 0; i < 18; i++) {

          tl.fromTo('#s12-glow', { opacity: 0.4, scale: 0.9 }, { opacity: 1, scale: 1.1, duration: 4.8, ease: 'sine.inOut' }, 0);
