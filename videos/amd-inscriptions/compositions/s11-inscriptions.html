<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/amd.css" />
      <style>
        #s11-root { position: absolute; inset: 0; overflow: hidden; }
        #s11-glow { width: 1500px; height: 1500px; left: 210px; top: -300px; }
        #s11-a { position: absolute; inset: 0; }
        #s11-h1 { position: absolute; left: 0; right: 0; top: 190px; text-align: center; font-size: 250px; color: #F7F3EA; }
        #s11-h2 { position: absolute; left: 0; right: 0; top: 440px; text-align: center; font-size: 250px; color: #E8B01C; text-shadow: 0 0 70px rgba(232,176,28,.3), 0 10px 40px rgba(0,0,0,.9); }

        #s11-b { position: absolute; inset: 0; }
        #s11-head { position: absolute; left: 0; right: 0; top: 50px; text-align: center; font-size: 120px; color: #F7F3EA; }

        #s11-cal { position: absolute; right: -50px; top: -50px; width: 140px; height: 140px; }
        #s11-cal svg { width: 86px; height: 86px; }
        #s11-vague { font-size: 96px; color: #E8B01C; }
        #s11-date { font-size: 250px; color: #F7F3EA; display: flex; align-items: center; gap: 26px; line-height: 1; }
        #s11-date .arrow { color: #E8B01C; font-size: 200px; }
        #s11-oct { font-size: 140px; color: #E8B01C; }
        #s11-price { position: absolute; left: 990px; top: 210px; width: 860px; height: 600px; }
        #s11-pimg { left: -120px; top: 50px; width: 1120px; height: 500px; }
        #s11-ptext { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B0A08; }
        #s11-plabel { font-size: 104px; margin-right: 60px; }
        #s11-pnum { font-size: 230px; line-height: 1; margin-right: 60px; }
        #s11-stamp { position: absolute; left: 50%; top: 840px; margin-left: -560px; width: 1120px; height: 190px; border: 10px solid #F7F3EA; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 140px; color: #F7F3EA; background: rgba(11,10,8,.7); }
      </style>
      <div id="s11-root" data-composition-id="s11-inscriptions" data-width="1920" data-height="1080">
        <div id="s11-cam" class="amd-cam">
          <div id="s11-glow" class="amd-glow"></div>
          <div id="s11-a">
            <div id="s11-h1" class="amd-anton amd-line amd-shadow" data-hf-motion-blur>Inscriptions</div>
            <div id="s11-h2" class="amd-anton amd-line" data-hf-motion-blur>Ouvertes</div>
            <div id="s11-wave"><div id="s11-wpill" class="amd-pill">1<sup style="font-size:.5em">re</sup>&nbsp;vague</div></div>
          </div>
          <div id="s11-b">
            <div id="s11-head" class="amd-anton amd-line amd-shadow">Inscriptions <span>ouvertes</span></div>
            <div id="s11-card">
              <div id="s11-cal" class="amd-icon"><svg viewBox="0 0 64 64"><rect x="8" y="12" width="48" height="44" rx="6" fill="#0B0A08"/><rect x="8" y="12" width="48" height="12" rx="6" fill="#0B0A08"/><rect x="18" y="5" width="6" height="14" rx="3" fill="#0B0A08"/><rect x="40" y="5" width="6" height="14" rx="3" fill="#0B0A08"/><g fill="#E8B01C"><rect x="15" y="30" width="8" height="7"/><rect x="28" y="30" width="8" height="7"/><rect x="41" y="30" width="8" height="7"/><rect x="15" y="42" width="8" height="7"/><rect x="28" y="42" width="8" height="7"/></g></svg></div>
              <div id="s11-vague" class="amd-bebas amd-line">1re vague</div>

            </div>
            <div id="s11-price">
              <img id="s11-pimg" class="amd-brush" src="assets/fx/brush-gold-1.png" alt="" />
              <div id="s11-ptext">
                <div id="s11-plabel" class="amd-anton amd-line">Inscription</div>
                <div id="s11-pnum" class="amd-anton amd-line" data-hf-motion-blur>2 000 F</div>
              </div>
            </div>
            <div id="s11-stamp" class="amd-anton amd-line" data-hf-motion-blur>Places limitées</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var S = 30.25; function T(t) { return Math.max(0, t - S); }
          tl.fromTo('#s11-glow', { opacity: 0.3, scale: 0.8 }, { opacity: 1, scale: 1.1, duration: 5.6, ease: 'sine.inOut' }, 0);
          // phase 1
          tl.fromTo('#s11-h1', { scale: 2, opacity: 0, filter: 'blur(18px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.32, ease: 'power4.out' }, 0.0);
          tl.fromTo('#s11-h2', { x: 1200, opacity: 0, skewX: -18 }, { x: 0, opacity: 1, skewX: 0, duration: 0.34, ease: 'expo.out' }, 0.25);
          tl.fromTo('#s11-wpill', { y: 160, scale: 0.6, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.36, ease: 'back.out(2)' }, T(30.9));
          tl.fromTo('#s11-a', { scale: 1 }, { scale: 1.05, duration: 1.6, ease: 'none' }, 0.3);
          tl.fromTo('#s11-a', { opacity: 1 }, { opacity: 0, scale: 1.4, filter: 'blur(12px)', duration: 0.22, ease: 'power3.in', immediateRender: false }, T(32.2));
          // phase 2 — date card
          tl.fromTo('#s11-b', { opacity: 0 }, { opacity: 1, duration: 0.01 }, T(32.38));
          tl.fromTo('#s11-head', { y: -160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: 'expo.out' }, T(32.38));
          tl.fromTo('#s11-card', { x: -900, rotation: -6, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.36, ease: 'expo.out' }, T(32.38));
          tl.fromTo('#s11-cal', { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: 'back.out(2.2)' }, T(32.55));
          tl.fromTo('#s11-d2', { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'power4.out' }, T(32.45));
          // price
          tl.fromTo('#s11-pimg', { clipPath: 'inset(0% 100% 0% 0%)', rotation: -4 }, { clipPath: 'inset(0% 0% 0% 0%)', rotation: -6, duration: 0.3, ease: 'power3.out' }, T(33.22));
          tl.fromTo('#s11-plabel', { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: 'expo.out' }, T(33.26));
          tl.fromTo('#s11-pnum', { scale: 2.4, opacity: 0, filter: 'blur(18px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power4.out' }, T(33.3));
          tl.fromTo('#s11-pnum', { scale: 1 }, { keyframes: { scale: [1, 1.08, 1] }, duration: 0.5, ease: 'sine.inOut', immediateRender: false }, T(34.0));
          // stamp
          tl.fromTo('#s11-stamp', { scale: 3, rotation: -18, opacity: 0 }, { scale: 1, rotation: -4, opacity: 1, duration: 0.24, ease: 'power4.in' }, T(34.3));
          tl.fromTo('#s11-cam', { x: 0, y: 0 }, { y: -180, scale: 1.2, filter: 'blur(10px)', duration: 0.26, ease: 'power3.in', immediateRender: false }, T(35.62));
          window.__timelines['s11-inscriptions'] = tl;
        })();
      </script>
    </template>
