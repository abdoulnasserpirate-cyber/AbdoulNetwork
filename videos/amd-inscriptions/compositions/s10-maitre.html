<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/amd.css" />
      <style>
        #s10-root { position: absolute; inset: 0; overflow: hidden; }
        #s10-glow { width: 1500px; height: 1500px; left: 210px; top: -420px; }
        #s10-ghost { right: 40px; top: 120px; font-size: 760px; }
        #s10-top { position: absolute; left: 0; right: 0; top: 0; height: 1080px; }
        #s10-label { position: absolute; left: 0; right: 0; top: 200px; text-align: center; font-size: 88px; letter-spacing: .32em; color: #F7F3EA; }
        #s10-band { position: absolute; left: 60px; top: 330px; width: 1800px; height: 340px; }
        #s10-bimg { left: 0; top: 0; width: 1800px; height: 340px; }
        #s10-name { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 14px; font-size: 200px; color: #0B0A08; }
        #s10-l1 { position: absolute; left: 140px; top: 640px; font-size: 140px; color: #F7F3EA; }
        #s10-l2 { position: absolute; left: 140px; top: 800px; font-size: 190px; color: #E8B01C; text-shadow: 0 0 60px rgba(232,176,28,.3), 0 10px 40px rgba(0,0,0,.9); }
        #s10-bars { position: absolute; right: 170px; top: 640px; width: 420px; height: 360px; display: flex; align-items: flex-end; gap: 30px; }
        .s10-bar { display: block; width: 110px; background: linear-gradient(#FFD45A, #B47F0C); border-radius: 10px 10px 0 0; transform-origin: 50% 100%; }
        #s10-arrow { position: absolute; right: 120px; top: 560px; width: 520px; height: 300px; }
      </style>
      <div id="s10-root" data-composition-id="s10-maitre" data-width="1920" data-height="1080">
        <div id="s10-cam" class="amd-cam">
          <div id="s10-glow" class="amd-glow"></div>
          <div id="s10-ghost" class="amd-ghost">德</div>
          <div id="s10-top">
            <div id="s10-label" class="amd-mont amd-line amd-shadow">Encadreur</div>
            <div id="s10-band">
              <img id="s10-bimg" class="amd-brush" src="assets/fx/brush-gold-1.png" alt="" />
              <div id="s10-name" class="amd-anton amd-line" data-hf-motion-blur>Maître Mohamed</div>
            </div>
          </div>
          <div id="s10-l1" class="amd-anton amd-line amd-shadow">Chaque séance</div>
          <div id="s10-l2" class="amd-anton amd-line" data-hf-motion-blur>Progresser</div>
          <div id="s10-bars"><i id="s10-b1" class="s10-bar" style="height:35%"></i><i id="s10-b2" class="s10-bar" style="height:65%"></i><i id="s10-b3" class="s10-bar" style="height:100%"></i></div>
          <svg id="s10-arrow" viewBox="0 0 520 300"><path id="s10-apath" d="M20 270 L200 150 L300 200 L480 40" fill="none" stroke="#F7F3EA" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/><path id="s10-ahead" d="M420 36 L486 34 L482 100" fill="none" stroke="#F7F3EA" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var S = 26.95; function T(t) { return Math.max(0, t - S); }
          tl.fromTo('#s10-glow', { opacity: 0.3, scale: 0.8 }, { opacity: 1, scale: 1, duration: 3.3, ease: 'sine.inOut' }, 0);
          tl.fromTo('#s10-ghost', { opacity: 0, y: 80 }, { opacity: 0.08, y: 0, duration: 2, ease: 'power2.out' }, 0);
          tl.fromTo('#s10-label', { opacity: 0, scaleX: 1.8 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: 'expo.out' }, 0.02);
          tl.fromTo('#s10-bimg', { clipPath: 'inset(0% 100% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.32, ease: 'power3.out' }, T(27.55));
          tl.fromTo('#s10-name', { scale: 1.7, opacity: 0, filter: 'blur(16px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power4.out' }, T(27.65));
          tl.fromTo('#s10-band', { rotation: 0 }, { rotation: -2.5, duration: 2.4, ease: 'sine.inOut' }, T(27.7));
          // lift the name block, reveal the progression
          tl.fromTo('#s10-top', { y: 0, scale: 1 }, { y: -150, scale: 0.86, duration: 0.42, ease: 'expo.inOut', immediateRender: false }, T(28.3));
          tl.fromTo('#s10-l1', { x: -700, opacity: 0 }, { x: 0, opacity: 1, duration: 0.34, ease: 'expo.out' }, T(28.46));
          tl.fromTo(['#s10-b1', '#s10-b2', '#s10-b3'], { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: 'back.out(1.6)', stagger: 0.12 }, T(28.5));
          tl.fromTo('#s10-l2', { y: 180, opacity: 0, rotation: -5 }, { y: 0, opacity: 1, rotation: 0, duration: 0.34, ease: 'circ.out' }, T(29.2));
          tl.fromTo('#s10-apath', { attr: { 'stroke-dashoffset': 1 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.45, ease: 'power2.out' }, T(29.2));
          tl.fromTo('#s10-ahead', { opacity: 0, scale: 0.4, transformOrigin: '90% 20%' }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2)' }, T(29.6));
          tl.fromTo('#s10-cam', { x: 0 }, { x: -200, filter: 'blur(8px)', duration: 0.24, ease: 'power3.in', immediateRender: false }, T(30.02));
          window.__timelines['s10-maitre'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
