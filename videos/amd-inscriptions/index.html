<!--
  Timeline integration example:

  <div id="root" data-composition-id="my-composition" data-duration="6" data-fps="30">
    <div id="my-box" data-hf-motion-blur></div>
    <div id="my-title" data-hf-motion-blur='{"shutterAngle": 360}'></div>
  </div>

  const tl = gsap.timeline({ paused: true });

  tl.fromTo("#my-box", { x: -100 }, { x: 1700, duration: 1.2, ease: "power3.inOut" }, 0.5);

  // Extend to data-duration so seeks past the last tween reach the blur callback.
  tl.set(document.body, {}, DATA_DURATION);

  // The registration below is what attaches both targets, in that order.
  window.__timelines = window.__timelines || {};
  window.__timelines["my-composition"] = tl;

  // Only for an element created later than the polling window above:
  attachMotionBlur("#late-box", tl, { shutterAngle: 720, samplesPerFrame: 16 });
-->

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var D = 44.225;

        // ---- seeded PRNG (deterministic embers) ----
        var seed = 1337;
        function rnd() { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; var t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

        var host = document.getElementById('embers');
        for (var i = 0; i < 64; i++) {
          var e = document.createElement('div');
          e.className = 'ember';
          var s = 2 + rnd() * 5;
          e.style.width = s + 'px'; e.style.height = s + 'px';
          host.appendChild(e);
          var x0 = rnd() * 1920, y0 = 1100 + rnd() * 3200, drift = (rnd() - 0.5) * 300;
          tl.fromTo(e, { x: x0, y: y0, opacity: 0.35 + rnd() * 0.6 }, { x: x0 + drift, y: y0 - 3400, duration: D, ease: 'none' }, 0);
        }

        // ambient background breath
        tl.fromTo('#bg-glow', { scale: 0.9, opacity: 0.55 }, { scale: 1.1, opacity: 0.9, duration: D / 4, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0);

        // ---- camera shake on impacts ----
        function shake(t, a) {
          tl.fromTo('#stage', { x: 0, y: 0, rotation: 0 }, {
            keyframes: [
              { x: a, y: -a * 0.6, rotation: a * 0.02, duration: 0.04 },
              { x: -a * 0.8, y: a * 0.5, rotation: -a * 0.015, duration: 0.05 },
              { x: a * 0.5, y: a * 0.3, rotation: a * 0.01, duration: 0.05 },
              { x: -a * 0.25, y: -a * 0.2, rotation: 0, duration: 0.06 },
              { x: 0, y: 0, rotation: 0, duration: 0.08 }
            ], ease: 'none', immediateRender: false
          }, t);
        }
        [[0.0, 22], [0.85, 16], [1.39, 16], [2.02, 20], [4.45, 14], [6.9, 10], [7.76, 10], [8.46, 16], [9.23, 16], [9.78, 18],
         [10.91, 14], [13.11, 14], [15.27, 12], [16.49, 12], [20.07, 12], [20.85, 18], [24.46, 12], [25.48, 10], [27.65, 16], [30.25, 14],
         [32.41, 14], [33.30, 18], [34.49, 18], [35.89, 12], [37.25, 10], [37.92, 10], [38.89, 10], [39.83, 14], [40.75, 16], [43.9, 12]
        ].forEach(function (p) { shake(p[0], p[1]); });

        // ---- flash ----
        function flash(t, o, d) {
          tl.fromTo('#flash', { opacity: 0 }, { keyframes: [{ opacity: o, duration: 0.04 }, { opacity: 0, duration: d || 0.28 }], ease: 'power2.out', immediateRender: false }, t);
        }
        [[0.0, 0.85, 0.4], [2.02, 0.35], [3.04, 0.95, 0.5], [8.46, 0.3], [9.78, 0.35], [10.9, 0.6], [15.26, 0.5], [20.06, 0.7], [26.94, 0.6], [33.30, 0.4], [34.49, 0.35], [35.88, 0.6], [39.83, 0.35], [40.73, 0.95, 0.6], [43.9, 0.45, 0.33]
        ].forEach(function (p) { flash(p[0], p[1], p[2]); });

        // ---- gold brush wipe transition (covers the cut at t) ----
        function wipe(t, rot) {
          tl.fromTo('#wipe', { x: -3540, y: 360, rotation: rot, scaleX: 1.9, scaleY: 3.9, opacity: 1 },
            { x: 3060, duration: 0.62, ease: 'power2.inOut', immediateRender: false }, t - 0.31);
          tl.fromTo('#wipe', { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, t + 0.32);
        }
        [[6.28, -8], [13.11, 6], [16.49, -6], [21.93, 8], [30.25, -7]].forEach(function (p) { wipe(p[0], p[1]); });

        // ---- gold slash transition ----
        function slash(t, rot, y) {
          tl.fromTo('#slash', { y: y - 470, rotation: rot, scaleX: 0, scaleY: 1.4, opacity: 1 }, { scaleX: 1, duration: 0.14, ease: 'expo.out', immediateRender: false }, t - 0.06);
          tl.fromTo('#slash', { opacity: 1 }, { opacity: 0, scaleY: 0.2, duration: 0.25, ease: 'power2.in', immediateRender: false }, t + 0.1);
        }
        [[10.91, -14, 560], [15.27, 12, 420], [20.07, -10, 520], [26.95, 9, 600], [35.89, -12, 520]].forEach(function (p) { slash(p[0], p[1], p[2]); });

        window.__timelines['main'] = tl;
      })();
    </script>
